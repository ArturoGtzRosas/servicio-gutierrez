<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Historial Servicios - Servicio Gutiérrez</title>
    <style>
        :root { --azul: #1f3a5f; --oro: #c5a356; }
        body { font-family: 'Segoe UI', sans-serif; background: #f4f4f4; padding: 20px; }
        .container { max-width: 1000px; margin: auto; background: white; padding: 20px; border-radius: 10px; border-top: 5px solid var(--oro); box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th { background: var(--azul); color: white; padding: 12px; text-align: left; }
        td { padding: 12px; border-bottom: 1px solid #eee; }
        .btn-pdf { background: #27ae60; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>
<div class="container">
    <h2>Solicitudes de Servicios</h2>
    <table>
        <thead>
            <tr><th>Cliente</th><th>Servicio</th><th>Modelo</th><th>Acciones</th></tr>
        </thead>
        <tbody>
            {% for c in cotizaciones %}
            <tr>
                <td>{{ c.nombre }}</td>
                <td>{{ c.servicio }}</td>
                <td>{{ c.modelo }}</td>
                <td>
                    <button class="btn-pdf" onclick="imprimirPDF('{{ c.nombre }}', '{{ c.servicio }}', '{{ c.modelo }}')">🖨️ PDF</button>
                    {% if session.get('user_rol') == 'admin' %}
                    <a href="{{ url_for('borrar_cotizacion', id=c.id) }}" class="btn-del" onclick="return confirm('¿Seguro que deseas eliminar esta cotización?');">🗑️</a>
                    {% endif %}
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
    <br>
    <a href="{{ url_for('dashboard') }}" style="text-decoration:none; color:var(--azul); font-weight:bold;">← Volver al Panel</a>
</div>

<script>
function imprimirPDF(nom, ser, mod) {
    const v = window.open('', '_blank');
    v.document.write(`<html><head><style>body{font-family:sans-serif;padding:40px;text-align:center;} .header{border-bottom:2px solid #c5a356;}</style></head><body><div class="header"><h1>SERVICIO GUTIÉRREZ</h1></div><h3>Cotización Técnica</h3><p><strong>Cliente:</strong> ${nom}</p><p><strong>Servicio:</strong> ${ser}</p><p><strong>Equipo:</strong> ${mod}</p><script>window.print();<\/script></body></html>`);
    v.document.close();
}
</script>
</body>
</html>
