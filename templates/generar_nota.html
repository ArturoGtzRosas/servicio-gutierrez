<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Nueva Nota de Venta - G-Tek Soluciones Digitales</title>
    <style>
        :root { --azul: #1b305b; --oro: #c5a059; }
        body { font-family: 'Segoe UI', sans-serif; background: #f4f4f4; padding: 20px; }
        .container { max-width: 800px; margin: auto; background: white; padding: 25px; border-radius: 10px; border-top: 5px solid var(--oro); box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { color: var(--azul); margin-top: 0; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        label { font-weight: bold; font-size: 13px; color: #333; display: block; margin-bottom: 4px; }
        input, textarea { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        
        /* Ajuste de renglones para que la descripción quede ancha */
        .item-row { 
            display: flex; 
            gap: 10px; 
            align-items: center; 
            margin-bottom: 10px; 
            width: 100%;
        }
        .item-row input[name="cantidad[]"] { 
            width: 70px; 
            flex-shrink: 0; 
            text-align: center;
        }
        .item-row input[name="descripcion[]"] { 
            flex-grow: 1; 
            min-width: 250px; 
        }
        .item-row input[name="precio[]"] { 
            width: 140px; 
            flex-shrink: 0; 
        }
        .item-row .btn-del { 
            width: 42px; 
            height: 38px;
            flex-shrink: 0; 
            background: #e74c3c; 
            color: white; 
            border: none; 
            border-radius: 4px; 
            cursor: pointer;
        }

        .btn-add { background: #34495e; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 13px; }
        .btn-guardar { background: #27ae60; color: white; border: none; padding: 12px; width: 100%; border-radius: 6px; font-weight: bold; font-size: 16px; cursor: pointer; margin-top: 15px; }
        .total-box { background: #e8f4fd; padding: 10px; border-radius: 5px; text-align: right; font-size: 18px; font-weight: bold; color: var(--azul); margin-top: 10px; }
    </style>
</head>
<body>
<div class="container">
    <h2>🧾 Emitir Nota de Venta</h2>
    <form method="POST" target="_blank">
        <!-- Selector de Cliente del Catálogo -->
        <div style="background: #f8f9fa; border: 1px solid #dcdcdc; border-left: 4px solid var(--oro); padding: 12px 15px; border-radius: 6px; margin-bottom: 20px;">
            <label style="color: var(--azul); font-weight: bold; margin-bottom: 6px; display: block;">
                👥 Seleccionar Cliente del Catálogo:
            </label>
            <select id="select_catalogo_clientes" onchange="autocompletarCliente(this)" style="width: 100%; padding: 9px; border: 1px solid #ccc; border-radius: 5px; font-size: 14px; background: white;">
                <option value="" data-dir="" data-tel="">-- Cliente Nuevo / Escribir Manualmente --</option>
                {% for cl in clientes_registrados %}
                <option value="{{ cl.cliente }}" data-dir="{{ cl.direccion or '' }}" data-tel="{{ cl.telefono or '' }}">
                    {{ cl.cliente }}{% if cl.telefono %} (Tel: {{ cl.telefono }}){% endif %}
                </option>
                {% endfor %}
            </select>
        </div>
        <div class="grid">
            <div>
                <label>Cliente:</label>
                <input type="text" name="cliente" required placeholder="Nombre completo">
            </div>
            <div>
                <label>Teléfono:</label>
                <input type="text" name="telefono" placeholder="55 1234 5678">
            </div>
            <div>
                <label>Correo Electrónico (opcional):</label>
                <input type="email" name="email" id="email" placeholder="cliente@correo.com">
            </div>
            <div>
                <label>Equipo:</label>
                <input type="text" name="equipo" required placeholder="Ej: Laptop Asus / PC Gamer">
            </div>
            <div style="grid-column: span 2;">
                <label>Dirección:</label>
                <input type="text" name="direccion" placeholder="Calle, Número, Municipio">
            </div>
        </div>

        <div style="margin-top: 15px;">
            <label>Observaciones Técnicas:</label>
            <textarea name="observaciones" rows="2" placeholder="Garantía, detalles o especificaciones adicionales"></textarea>
        </div>

        <hr style="margin: 20px 0; border: 0; border-top: 1px solid #ddd;">
        <label>Servicios / Refacciones:</label>
        <div id="contenedor-items">
            <div class="item-row">
                <input type="number" name="cantidad[]" value="1" min="1" placeholder="Cant">
                <input type="text" name="descripcion[]" required placeholder="Descripción del servicio o artículo">
                <input type="number" step="0.5" name="precio[]" required placeholder="P. Unitario $" class="precio-item" oninput="calcularTotal()">
                <button type="button" class="btn-del" onclick="eliminarFila(this)">✕</button>
            </div>
        </div>

        <button type="button" class="btn-add" onclick="agregarFila()">+ Agregar Renglón</button>

        <div class="total-box">Total a Cobrar: $<span id="lblTotal">0.00</span></div>

        <div style="display: flex; gap: 12px; margin-top: 15px;">
    <button type="submit" class="btn-guardar" style="margin-top: 0; flex: 2;">💾 Guardar y Descargar Nota en PDF</button>
    <button type="button" onclick="limpiarFormulario()" style="flex: 1; background: #7f8c8d; color: white; border: none; padding: 12px; border-radius: 6px; font-weight: bold; font-size: 15px; cursor: pointer;">✨ Nueva Nota / Limpiar</button>
        </div>
    </form>
    <br>
    <a href="{{ url_for('ver_notas') }}" style="text-decoration:none; color:var(--azul); font-weight:bold;">← Volver al Historial de Notas</a>
</div>

<script>
function agregarFila() {
    const div = document.createElement('div');
    div.className = 'item-row';
    div.innerHTML = `
        <input type="number" name="cantidad[]" value="1" min="1" placeholder="Cant">
        <input type="text" name="descripcion[]" required placeholder="Descripción del servicio o artículo">
        <input type="number" step="0.5" name="precio[]" required placeholder="P. Unitario $" class="precio-item" oninput="calcularTotal()">
        <button type="button" class="btn-del" onclick="eliminarFila(this)">✕</button>
    `;
    document.getElementById('contenedor-items').appendChild(div);
}
function eliminarFila(btn) {
    if(document.querySelectorAll('.item-row').length > 1) {
        btn.parentElement.remove();
        calcularTotal();
    }
}
function calcularTotal() {
    let total = 0;
    const filas = document.querySelectorAll('.item-row');
    filas.forEach(f => {
        const c = parseFloat(f.querySelector('input[name="cantidad[]"]').value) || 1;
        const p = parseFloat(f.querySelector('.precio-item').value) || 0;
        total += c * p;
    });
    document.getElementById('lblTotal').innerText = total.toLocaleString('es-MX', {minimumFractionDigits: 2, maximumFractionDigits: 2});
}

function limpiarFormulario() {
    if (confirm('¿Deseas limpiar todos los campos para crear una nueva nota?')) {
        document.querySelector('form').reset();
        
        // Dejar solo un renglón limpio en servicios
        const contenedor = document.getElementById('contenedor-items');
        contenedor.innerHTML = `
            <div class="item-row">
                <input type="number" name="cantidad[]" value="1" min="1" placeholder="Cant">
                <input type="text" name="descripcion[]" required placeholder="Descripción del servicio o artículo">
                <input type="number" step="0.5" name="precio[]" required placeholder="P. Unitario $" class="precio-item" oninput="calcularTotal()">
                <button type="button" class="btn-del" onclick="eliminarFila(this)">✕</button>
            </div>
        `;
        calcularTotal();
        const sel = document.getElementById('select_catalogo_clientes');
        if (sel) sel.selectedIndex = 0;
        document.querySelector('input[name="cliente"]').focus();
    }
}

function autocompletarCliente(select) {
    const opcion = select.options[select.selectedIndex];
    const nombre = select.value;
    const direccion = opcion.getAttribute('data-dir') || '';
    const telefono = opcion.getAttribute('data-tel') || '';

    const inputCliente = document.querySelector('input[name="cliente"]');
    const inputDireccion = document.querySelector('input[name="direccion"]');
    const inputTelefono = document.querySelector('input[name="telefono"]');

    if (nombre) {
        inputCliente.value = nombre;
        inputDireccion.value = direccion;
        inputTelefono.value = telefono;
    } else {
        inputCliente.value = '';
        inputDireccion.value = '';
        inputTelefono.value = '';
        inputCliente.focus();
    }
}

</script>
</body>
</html>
