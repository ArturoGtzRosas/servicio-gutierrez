<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Administrativo - Servicio Gutiérrez</title>
    <link rel="shortcut icon" href="{{ url_for('static', filename='img/unam.png') }}" type="image/x-icon">
    <style>
        :root { --azul: #1f3a5f; --oro: #c5a356; }
        body { 
            font-family: 'Segoe UI', sans-serif; 
            background: linear-gradient(135deg, var(--azul) 0%, #162a45 100%);
            margin: 0; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh;
        }
        .login-card {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 350px;
            text-align: center;
            border-bottom: 8px solid var(--oro);
        }
        .login-card img { max-width: 100px; margin-bottom: 20px; }
        h2 { color: var(--azul); margin-bottom: 25px; text-transform: uppercase; letter-spacing: 1px; }
        .form-group { text-align: left; margin-bottom: 20px; }
        label { display: block; color: var(--azul); font-weight: bold; margin-bottom: 5px; font-size: 0.9em; }
        input { 
            width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; 
            box-sizing: border-box; font-size: 16px; transition: 0.3s;
        }
        input:focus { border-color: var(--oro); outline: none; box-shadow: 0 0 8px rgba(197, 163, 86, 0.3); }
        .btn-login { 
            width: 100%; background: var(--azul); color: var(--oro); border: none; 
            padding: 14px; border-radius: 6px; font-weight: bold; cursor: pointer; 
            font-size: 1em; transition: 0.3s; margin-top: 10px;
        }
        .btn-login:hover { background: #162a45; transform: scale(1.02); }
        .error-msg { color: #e74c3c; font-size: 0.85em; margin-bottom: 15px; background: #fadbd8; padding: 10px; border-radius: 4px; }
        .back-link { display: block; margin-top: 20px; color: #777; text-decoration: none; font-size: 0.85em; }
        .back-link:hover { color: var(--azul); }
    </style>
</head>
<body>
    <div class="login-card">
        <img src="{{ url_for('static', filename='img/unam.png') }}" alt="Logo UNAM">
        <h2>Panel Admin</h2>

        {% with messages = get_flashed_messages() %}
          {% if messages %}
            {% for message in messages %}
              <div class="error-msg">{{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form method="POST">
            <div class="form-group">
                <label>Correo Electrónico</label>
                <input type="email" name="email" required placeholder="tu@correo.com">
            </div>
            <div class="form-group">
                <label>Contraseña</label>
                <input type="password" name="password" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn-login">ENTRAR AL SISTEMA</button>
        </form>
        <a href="{{ url_for('index') }}" class="back-link">← Regresar al sitio público</a>
    </div>
</body>
</html>
