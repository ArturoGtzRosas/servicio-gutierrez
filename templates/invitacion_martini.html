<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emily & Emiliano | A 'Tini Bit Older</title>

    <!-- Metaetiquetas para WhatsApp -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="🍸 Emily & Emiliano are A 'Tini Bit Older">
    <meta property="og:description" content="Acompáñanos a celebrar nuestro cumpleaños con cócteles y café. Confirma aquí.">
    <meta property="og:image" content="https://gtek-soluciones.com/static/img/invitacion_preview.jpg">
    <meta property="og:url" content="https://gtek-soluciones.com/invitacion">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,400&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>

    <style>
        :root {
            --bg-outer: #0a0605;
            --bg-card: #f9f6f0;
            --espresso-dark: #2c1d16;
            --espresso-mid: #4a3328;
            --caramel: #8c5835;
            --line-border: #d8cebe;
            --text-sub: #7a6a5e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            /* Fondo de la página completo con la textura desenfocada */
            background: linear-gradient(rgba(10, 6, 5, 0.7), rgba(10, 6, 5, 0.85)),
                        url("{{ url_for('static', filename='img/background_texture.jpg') }}") no-repeat center center fixed;
            background-size: cover;
            color: var(--espresso-dark);
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px 12px;
            position: relative;
            overflow-x: hidden;
        }

        /* Partículas doradas de fondo */
        #particleCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* La Tarjeta que ahora actúa como el póster vertical interactivo */
        .phone-frame {
            background-color: var(--bg-card);
            border: 1px solid var(--line-border);
            border-radius: 28px;
            max-width: 410px;
            width: 100%;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
            position: relative;
            z-index: 1;
            animation: fadeInCard 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fadeInCard {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Poster Ilustrado en Acuarela (Casi toda la pantalla) */
        .poster-container {
            width: 100%;
            position: relative;
            line-height: 0;
        }

        .poster-image {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Degradado suave para fundir el póster con la zona interactiva inferior */
        .poster-fade {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 60px;
            background: linear-gradient(to bottom, transparent, var(--bg-card));
        }

        /* Bloque Ubicación */
        .location-section {
            padding: 12px 24px 20px 24px;
            font-size: 0.85rem;
            line-height: 1.5;
            color: var(--espresso-mid);
            background-color: var(--bg-card);
            margin-top: -10px;
            position: relative;
            z-index: 2;
        }

        .location-section strong {
            display: block;
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.15rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--espresso-dark);
            margin-bottom: 4px;
        }

        .map-btn {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            margin-top: 8px;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--caramel);
            text-decoration: none;
            font-weight: 600;
            border-bottom: 1px solid var(--caramel);
            padding-bottom: 2px;
            transition: color 0.2s ease, border-color 0.2s ease;
        }

        .map-btn:hover {
            color: var(--espresso-dark);
            border-color: var(--espresso-dark);
        }

        /* Formulario RSVP */
        .rsvp-card {
            background-color: #f2ebe2;
            border-radius: 20px;
            margin: 0 20px 24px 20px;
            padding: 24px 18px;
            text-align: left;
            border: 1px dashed var(--line-border);
            position: relative;
            z-index: 2;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
        }

        .rsvp-header {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 2.5px;
            font-weight: 700;
            text-align: center;
            color: var(--espresso-dark);
            margin-bottom: 14px;
        }

        .form-item {
            margin-bottom: 12px;
        }

        label {
            display: block;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text-sub);
            margin-bottom: 5px;
            font-weight: 600;
        }

        input, select {
            width: 100%;
            background-color: #fff;
            border: 1px solid var(--line-border);
            border-radius: 8px;
            padding: 11px 12px;
            font-size: 0.9rem;
            color: var(--espresso-dark);
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        input:focus, select:focus {
            border-color: var(--caramel);
            box-shadow: 0 0 8px rgba(140, 88, 53, 0.15);
        }

        .btn-submit {
            width: 100%;
            background: var(--espresso-dark);
            color: #f9f6f0;
            border: none;
            border-radius: 8px;
            padding: 14px;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            cursor: pointer;
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: background 0.2s ease, transform 0.1s ease;
            box-shadow: 0 4px 12px rgba(44, 29, 22, 0.2);
        }

        .btn-submit:hover {
            background: var(--espresso-mid);
        }

        .btn-submit:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <!-- Fondo dinámico de partículas flotantes -->
    <canvas id="particleCanvas"></canvas>

    <div class="phone-frame">
        
        <!-- Sección del Póster de Acuarela -->
        <div class="poster-container">
            <img src="{{ url_for('static', filename='img/espresso_header.jpg') }}" alt="Emily & Emiliano | A 'Tini Bit Older" class="poster-image">
            <div class="poster-fade"></div>
        </div>

        <!-- Detalles de Ubicación -->
        <div class="location-section">
            <strong>San Nicolás</strong>
            <p>Tacario 166, Centro</p>
            <p>Maravatío de Ocampo, Michoacán</p>
            <a class="map-btn" href="https://www.google.com/maps/search/?api=1&query=Tacario+166+San+Nicolas+Centro+Maravatio+de+Ocampo+Michoacan" target="_blank" rel="noopener">
                📍 Ver en Google Maps
            </a>
        </div>

        <!-- Formulario RSVP -->
        <section class="rsvp-card">
            <h2 class="rsvp-header">Confirmar Asistencia</h2>

            <div class="form-item">
                <label for="guestName">Nombre del Invitado</label>
                <input type="text" id="guestName" placeholder="Tu nombre y apellido" required>
            </div>

            <div class="form-item">
                <label for="guestsCount">Acompañantes</label>
                <select id="guestsCount">
                    <option value="Voy solo(a)">Voy solo(a)</option>
                    <option value="+1 Acompañante">+1 Acompañante</option>
                    <option value="+2 Acompañantes">+2 Acompañantes</option>
                    <option value="+3 Acompañantes">+3 Acompañantes</option>
                </select>
            </div>

            <div class="form-item">
                <label for="drinkPref">Bebida de Preferencia</label>
                <select id="drinkPref">
                    <option value="Espresso Martini clásico">Espresso Martini clásico</option>
                    <option value="Carajillo shakerato">Carajillo shakerato</option>
                    <option value="Cóctel sin alcohol (Mocktail)">Cóctel sin alcohol</option>
                    <option value="Cerveza / Vino / Refresco">Cerveza / Vino / Refresco</option>
                </select>
            </div>

            <button type="button" class="btn-submit" onclick="enviarConfirmacion()">
                Confirmar por WhatsApp 💬
            </button>
        </section>
    </div>

    <script>
        // Animación de partículas flotantes en Canvas
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor() {
                this.reset();
            }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 1.8 + 0.4;
                this.speedY = -(Math.random() * 0.3 + 0.1);
                this.speedX = (Math.random() - 0.5) * 0.15;
                this.alpha = Math.random() * 0.4 + 0.1;
                this.fade = Math.random() * 0.004 + 0.001;
            }
            update() {
                this.y += this.speedY;
                this.x += this.speedX;
                this.alpha += this.fade;
                if (this.alpha <= 0.05 || this.alpha >= 0.5) this.fade = -this.fade;
                if (this.y < -10) this.reset();
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.alpha);
                ctx.fillStyle = '#d4af37';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        const particleCount = window.innerWidth < 600 ? 20 : 40;
        for (let i = 0; i < particleCount; i++) {
            particles.push(new Particle());
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animate);
        }
        animate();

        // Enlace para confirmaciones de WhatsApp
        const TELEFONO_WHATSAPP = '524471178214';

        function enviarConfirmacion() {
            const nombre = document.getElementById('guestName').value.trim();
            const acompanantes = document.getElementById('guestsCount').value;
            const bebida = document.getElementById('drinkPref').value;

            if (!nombre) {
                alert('Por favor escribe tu nombre antes de enviar la confirmación.');
                document.getElementById('guestName').focus();
                return;
            }

            // Confeti de chocolate/oro
            if (typeof confetti === 'function') {
                confetti({
                    particleCount: 65,
                    spread: 60,
                    origin: { y: 0.88 },
                    colors: ['#8c5835', '#d9be9b', '#2c1d16', '#e5c378']
                });
            }

            const mensaje = `¡Hola! Confirmo mi asistencia al cumpleaños de Emily y Emiliano 🍸☕%0A%0A` +
                            `👤 *Invitado:* ${encodeURIComponent(nombre)}%0A` +
                            `👥 *Acompañantes:* ${encodeURIComponent(acompanantes)}%0A` +
                            `🍸 *Bebida preferida:* ${encodeURIComponent(bebida)}%0A%0A` +
                            `¡Nos vemos el sábado 14 de noviembre a las 7:00 PM!`;

            const url = `https://wa.me/${TELEFONO_WHATSAPP}?text=${mensaje}`;

            setTimeout(() => {
                window.open(url, '_blank');
            }, 450);
        }
    </script>
</body>
</html>
