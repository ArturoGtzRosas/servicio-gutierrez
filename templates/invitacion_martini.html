<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emily & Emiliano | A 'Tini Bit Older</title>

    <meta property="og:type" content="website">
    <meta property="og:title" content="🍸 Emily & Emiliano are A 'Tini Bit Older">
    <meta property="og:description" content="Acompáñanos a celebrar nuestro cumpleaños. Confirma tu asistencia aquí.">
    <meta property="og:image" content="https://gtek-soluciones.com/static/img/invitacion_preview.jpg">
    <meta property="og:url" content="https://gtek-soluciones.com/invitacion">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,400&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>

    <style>
        :root {
            --espresso-dark: #20130d;
            --espresso-mid: #4a3328;
            --caramel: #8c5835;
            --line-border: #dcd2c4;
            --text-sub: #635347;
            --gold-glow: rgba(212, 175, 55, 0.45);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: linear-gradient(rgba(10, 6, 5, 0.2), rgba(10, 6, 5, 0.5)),
                        url("{{ url_for('static', filename='img/background_texture.jpg') }}?v=9") no-repeat center center fixed;
            background-size: cover;
            color: var(--espresso-dark);
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 34px 18px;
            position: relative;
            overflow-x: hidden;
        }

        /* Botón flotante para pausar/reproducir audio */
        .music-btn {
            position: fixed;
            top: 18px;
            right: 18px;
            z-index: 1001;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(26, 17, 13, 0.85);
            border: 1.5px solid rgba(212, 175, 55, 0.7);
            color: #f7eed7;
            font-size: 1.15rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            backdrop-filter: blur(8px);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .music-btn.playing {
            border-color: #d4af37;
            animation: musicPulse 2.2s infinite ease-in-out;
        }

        @keyframes musicPulse {
            0%, 100% { transform: scale(1); box-shadow: 0 0 10px rgba(212, 175, 55, 0.3); }
            50% { transform: scale(1.08); box-shadow: 0 0 20px rgba(212, 175, 55, 0.65); }
        }

        /* Capa de globos */
        .balloons-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 999;
            overflow: hidden;
        }

        .balloon {
            position: absolute;
            top: -120px;
            width: 38px;
            height: 48px;
            border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
            opacity: 0.85;
            animation: fallDown linear infinite;
        }

        .balloon::before {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 50%;
            transform: translateX(-50%);
            width: 6px;
            height: 5px;
            border-radius: 3px;
            background: inherit;
        }

        .balloon::after {
            content: '';
            position: absolute;
            bottom: -32px;
            left: 50%;
            width: 1px;
            height: 28px;
            background: rgba(220, 200, 180, 0.6);
        }

        .balloon-shine {
            position: absolute;
            top: 7px;
            left: 8px;
            width: 8px;
            height: 13px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.55);
            transform: rotate(-30deg);
        }

        .balloon.gold {
            background: radial-gradient(circle at 35% 35%, #fff1c5 0%, #d4af37 55%, #8c6d1f 100%);
            box-shadow: 0 4px 12px rgba(212, 175, 55, 0.35);
        }

        .balloon.espresso {
            background: radial-gradient(circle at 35% 35%, #8a5a40 0%, #422618 60%, #1f1008 100%);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
        }

        .balloon.bronze {
            background: radial-gradient(circle at 35% 35%, #ebd1b5 0%, #af7a50 55%, #664124 100%);
            box-shadow: 0 4px 10px rgba(175, 122, 80, 0.3);
        }

        @keyframes fallDown {
            0% { transform: translateY(0) rotate(0deg) translateX(0); opacity: 0; }
            10% { opacity: 0.85; }
            50% { transform: translateY(55vh) rotate(8deg) translateX(18px); }
            90% { opacity: 0.85; }
            100% { transform: translateY(115vh) rotate(-10deg) translateX(-15px); opacity: 0; }
        }

        /* Tarjeta central */
        .poster-card {
            background-color: #f7f3ed;
            border: 1px solid rgba(212, 175, 55, 0.4);
            border-radius: 24px;
            max-width: 340px;
            width: 86%;
            box-shadow: 0 25px 65px rgba(0, 0, 0, 0.85), 0 0 25px var(--gold-glow);
            position: relative;
            z-index: 10;
            overflow: hidden;
            animation: fadeInCard 0.8s ease-out forwards;
        }

        @keyframes fadeInCard {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .poster-wrapper {
            position: relative;
            overflow: hidden;
            width: 100%;
        }

        .poster-wrapper::after {
            content: '';
            position: absolute;
            top: -100%;
            left: -150%;
            width: 80%;
            height: 300%;
            background: linear-gradient(
                to right,
                rgba(255, 255, 255, 0) 0%,
                rgba(255, 235, 170, 0.28) 50%,
                rgba(255, 255, 255, 0) 100%
            );
            transform: rotate(30deg);
            animation: foilShimmer 5s infinite ease-in-out;
            pointer-events: none;
        }

        @keyframes foilShimmer {
            0%, 20% { left: -150%; }
            60%, 100% { left: 160%; }
        }

        .poster-image {
            width: 100%;
            height: auto;
            display: block;
        }

        .actions-panel {
            padding: 14px 18px 22px 18px;
            background-color: #f7f3ed;
            text-align: center;
        }

        .location-box {
            margin-bottom: 16px;
            font-size: 0.8rem;
            line-height: 1.4;
            color: var(--espresso-mid);
        }

        .location-box strong {
            display: block;
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.15rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--espresso-dark);
            margin-bottom: 2px;
        }

        .map-btn {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            margin-top: 6px;
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: var(--caramel);
            text-decoration: none;
            font-weight: 600;
            border-bottom: 1px solid var(--caramel);
            padding-bottom: 1px;
        }

        .download-video-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: var(--espresso-dark);
            text-decoration: none;
            font-weight: 600;
            background: rgba(212, 175, 55, 0.15);
            border: 1px solid rgba(212, 175, 55, 0.45);
            border-radius: 20px;
            padding: 5px 12px;
            transition: all 0.2s ease;
        }

        .download-video-btn:hover {
            background: rgba(212, 175, 55, 0.3);
            border-color: var(--caramel);
        }

        .rsvp-container {
            background: rgba(255, 255, 255, 0.75);
            border: 1px dashed var(--line-border);
            border-radius: 14px;
            padding: 16px 14px;
            text-align: left;
        }

        .rsvp-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 1.8px;
            font-weight: 700;
            text-align: center;
            color: var(--espresso-dark);
            margin-bottom: 10px;
        }

        .form-item {
            margin-bottom: 10px;
        }

        label {
            display: block;
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-sub);
            margin-bottom: 3px;
            font-weight: 600;
        }

        input, select {
            width: 100%;
            background: #fff;
            border: 1px solid var(--line-border);
            border-radius: 6px;
            padding: 9px 10px;
            font-size: 0.85rem;
            color: var(--espresso-dark);
            font-family: inherit;
            outline: none;
        }

        input:focus, select:focus {
            border-color: var(--caramel);
        }

        .btn-submit {
            width: 100%;
            background: var(--espresso-dark);
            color: #f7f3ed;
            border: none;
            border-radius: 8px;
            padding: 13px;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.82rem;
            font-weight: 600;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            cursor: pointer;
            margin-top: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: background 0.2s ease;
        }

        .btn-submit:hover {
            background: var(--espresso-mid);
        }
    </style>
</head>
<body>

    <!-- Botón flotante para la música -->
    <button id="musicToggleBtn" class="music-btn" aria-label="Reproducir música" onclick="toggleMusic()">
        <span id="musicIcon">🎵</span>
    </button>

    <!-- Elemento de audio en loop -->
    <audio id="bgMusic" loop preload="auto">
        <source src="{{ url_for('static', filename='audio/espresso_jazz.mp3') }}" type="audio/mpeg">
    </audio>

    <div class="balloons-container" id="balloonsContainer"></div>

    <div class="poster-card">
        <div class="poster-wrapper">
            <img src="{{ url_for('static', filename='img/espresso_header.jpg') }}?v=9" alt="Invitación Emily & Emiliano" class="poster-image">
        </div>

        <div class="actions-panel">
            <div class="location-box">
                    <strong>San Nicolás</strong>
                    <p>Tacario 166, Centro</p>
                    <p>Maravatío de Ocampo, Michoacán</p>
                    
                    <div style="display: flex; flex-direction: column; align-items: center; gap: 8px; margin-top: 8px;">
                        <a class="map-btn" href="https://www.google.com/maps/search/?api=1&query=Tacario+166+San+Nicolas+Centro+Maravatio+de+Ocampo+Michoacan" target="_blank" rel="noopener">
                            📍 Abrir en Google Maps
                        </a>

                        <!-- Botón de Descarga del Video -->
                        <a class="download-video-btn" href="{{ url_for('descargar_video_invitacion') }}">
                            🎬 Descargar Video Invitación
                        </a>
                    </div>
                </div>

            <section class="rsvp-container">
                <h2 class="rsvp-title">Confirmar Asistencia</h2>

                <div class="form-item">
                    <label for="guestName">Nombre del Invitado</label>
                    <input type="text" id="guestName" placeholder="Tu nombre y apellido" required>
                </div>

                <div class="form-item">
                    <label for="guestsCount">Acompañantes</label>
                    <select id="guestsCount">
                        <option value="Voy solo(a)">Voy solo(a)</option>
                        <option value="+1 Acompañante">+1 Acompañante</option>
                        <option value="+2 Acompañantes">+2 Acompañantes</option>
                        <option value="+3 Acompañantes">+3 Acompañantes</option>
                    </select>
                </div>

                <button type="button" class="btn-submit" onclick="enviarConfirmacion()">
                    Confirmar por WhatsApp 💬
                </button>
            </section>
        </div>
    </div>

    <script>
        // Control de Audio
        const audio = document.getElementById('bgMusic');
        const musicBtn = document.getElementById('musicToggleBtn');
        const musicIcon = document.getElementById('musicIcon');
        let isPlaying = false;

        function toggleMusic() {
            if (isPlaying) {
                audio.pause();
                musicBtn.classList.remove('playing');
                musicIcon.textContent = '🔇';
                isPlaying = false;
            } else {
                audio.play().then(() => {
                    musicBtn.classList.add('playing');
                    musicIcon.textContent = '🎵';
                    isPlaying = true;
                }).catch(e => console.log('Bloqueado por navegador:', e));
            }
        }

        // Se activa con cualquier interacción inicial (scroll, swipe o clic)
        const userEvents = ['click', 'touchstart', 'scroll', 'touchmove'];
        function autoPlayOnGesture() {
            if (!isPlaying) {
                audio.play().then(() => {
                    musicBtn.classList.add('playing');
                    musicIcon.textContent = '🎵';
                    isPlaying = true;
                }).catch(() => {});
            }
            userEvents.forEach(evt => document.removeEventListener(evt, autoPlayOnGesture));
        }
        userEvents.forEach(evt => document.addEventListener(evt, autoPlayOnGesture, { passive: true }));

        // Generador de globos
        const container = document.getElementById('balloonsContainer');
        const types = ['gold', 'espresso', 'bronze'];
        const balloonCount = window.innerWidth < 600 ? 14 : 22;

        for (let i = 0; i < balloonCount; i++) {
            const b = document.createElement('div');
            const type = types[Math.floor(Math.random() * types.length)];
            b.className = `balloon ${type}`;

            const shine = document.createElement('div');
            shine.className = 'balloon-shine';
            b.appendChild(shine);

            const left = Math.random() * 94;
            const size = Math.random() * 0.4 + 0.85;
            const duration = Math.random() * 5 + 6.5;
            const delay = Math.random() * 9;

            b.style.left = `${left}%`;
            b.style.transform = `scale(${size})`;
            b.style.animationDuration = `${duration}s`;
            b.style.animationDelay = `-${delay}s`;

            container.appendChild(b);
        }

        const TELEFONO_WHATSAPP = '524471178214';

        function enviarConfirmacion() {
            const nombre = document.getElementById('guestName').value.trim();
            const acompanantes = document.getElementById('guestsCount').value;

            if (!nombre) {
                alert('Por favor escribe tu nombre antes de enviar la confirmación.');
                document.getElementById('guestName').focus();
                return;
            }

            if (typeof confetti === 'function') {
                confetti({
                    particleCount: 50,
                    spread: 60,
                    origin: { y: 0.85 },
                    colors: ['#8c5835', '#d9be9b', '#2c1d16']
                });
            }

            const mensaje = `¡Hola! Confirmo mi asistencia al cumpleaños de Emily y Emiliano 🍸☕%0A%0A` +
                            `👤 *Invitado:* ${encodeURIComponent(nombre)}%0A` +
                            `👥 *Acompañantes:* ${encodeURIComponent(acompanantes)}%0A%0A` +
                            `¡Nos vemos el sábado 14 de noviembre a las 7:00 PM!`;

            const url = `https://wa.me/${TELEFONO_WHATSAPP}?text=${mensaje}`;

            setTimeout(() => {
                window.open(url, '_blank');
            }, 400);
        }
    </script>
</body>
</html>
