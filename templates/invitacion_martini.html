<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emily & Emiliano | A 'Tini Bit Older</title>

    <meta property="og:type" content="website">
    <meta property="og:title" content="🍸 Emily & Emiliano are A 'Tini Bit Older">
    <meta property="og:description" content="Acompáñanos a celebrar nuestro cumpleaños. Confirma tu asistencia aquí.">
    <meta property="og:image" content="https://gtek-soluciones.com/static/img/invitacion_preview.jpg">
    <meta property="og:url" content="https://gtek-soluciones.com/invitacion">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,400&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>

    <style>
        :root {
            --espresso-dark: #20130d;
            --espresso-mid: #4a3328;
            --caramel: #8c5835;
            --line-border: #dcd2c4;
            --text-sub: #635347;
            --gold-glow: rgba(212, 175, 55, 0.4);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: linear-gradient(rgba(10, 6, 5, 0.2), rgba(10, 6, 5, 0.5)),
                        url("{{ url_for('static', filename='img/background_texture.jpg') }}?v=6") no-repeat center center fixed;
            background-size: cover;
            color: var(--espresso-dark);
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 32px 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* Capa frontal para los globos animados */
        #balloonsCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
        }

        .poster-card {
            background-color: #f7f3ed;
            border: 1px solid rgba(212, 175, 55, 0.4);
            border-radius: 24px;
            max-width: 340px;
            width: 86%;
            box-shadow: 0 25px 65px rgba(0, 0, 0, 0.8), 0 0 25px var(--gold-glow);
            position: relative;
            z-index: 1;
            overflow: hidden;
            animation: fadeInCard 0.8s ease-out forwards;
        }

        @keyframes fadeInCard {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Contenedor de la ilustración con reflejo de luz sutil */
        .poster-wrapper {
            position: relative;
            overflow: hidden;
            width: 100%;
        }

        .poster-wrapper::after {
            content: '';
            position: absolute;
            top: -100%;
            left: -150%;
            width: 80%;
            height: 300%;
            background: linear-gradient(
                to right,
                rgba(255, 255, 255, 0) 0%,
                rgba(255, 235, 170, 0.28) 50%,
                rgba(255, 255, 255, 0) 100%
            );
            transform: rotate(30deg);
            animation: foilShimmer 5s infinite ease-in-out;
            pointer-events: none;
        }

        @keyframes foilShimmer {
            0%, 20% { left: -150%; }
            60%, 100% { left: 160%; }
        }

        .poster-image {
            width: 100%;
            height: auto;
            display: block;
        }

        .actions-panel {
            padding: 14px 18px 22px 18px;
            background-color: #f7f3ed;
            text-align: center;
        }

        .location-box {
            margin-bottom: 16px;
            font-size: 0.8rem;
            line-height: 1.4;
            color: var(--espresso-mid);
        }

        .location-box strong {
            display: block;
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.15rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--espresso-dark);
            margin-bottom: 2px;
        }

        .map-btn {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            margin-top: 6px;
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: var(--caramel);
            text-decoration: none;
            font-weight: 600;
            border-bottom: 1px solid var(--caramel);
            padding-bottom: 1px;
        }

        .rsvp-container {
            background: rgba(255, 255, 255, 0.75);
            border: 1px dashed var(--line-border);
            border-radius: 14px;
            padding: 16px 14px;
            text-align: left;
        }

        .rsvp-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 1.8px;
            font-weight: 700;
            text-align: center;
            color: var(--espresso-dark);
            margin-bottom: 10px;
        }

        .form-item {
            margin-bottom: 10px;
        }

        label {
            display: block;
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-sub);
            margin-bottom: 3px;
            font-weight: 600;
        }

        input, select {
            width: 100%;
            background: #fff;
            border: 1px solid var(--line-border);
            border-radius: 6px;
            padding: 9px 10px;
            font-size: 0.85rem;
            color: var(--espresso-dark);
            font-family: inherit;
            outline: none;
        }

        input:focus, select:focus {
            border-color: var(--caramel);
        }

        .btn-submit {
            width: 100%;
            background: var(--espresso-dark);
            color: #f7f3ed;
            border: none;
            border-radius: 8px;
            padding: 13px;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.82rem;
            font-weight: 600;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            cursor: pointer;
            margin-top: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: background 0.2s ease;
        }

        .btn-submit:hover {
            background: var(--espresso-mid);
        }
    </style>
</head>
<body>

    <!-- Globos cayendo y flotando -->
    <canvas id="balloonsCanvas"></canvas>

    <div class="poster-card">
        <div class="poster-wrapper">
            <img src="{{ url_for('static', filename='img/espresso_header.jpg') }}?v=6" alt="Invitación Emily & Emiliano" class="poster-image">
        </div>

        <div class="actions-panel">
            <div class="location-box">
                <strong>San Nicolás</strong>
                <p>Tacario 166, Centro</p>
                <p>Maravatío de Ocampo, Michoacán</p>
                <a class="map-btn" href="https://www.google.com/maps/search/?api=1&query=Tacario+166+San+Nicolas+Centro+Maravatio+de+Ocampo+Michoacan" target="_blank" rel="noopener">
                    📍 Abrir en Google Maps
                </a>
            </div>

            <section class="rsvp-container">
                <h2 class="rsvp-title">Confirmar Asistencia</h2>

                <div class="form-item">
                    <label for="guestName">Nombre del Invitado</label>
                    <input type="text" id="guestName" placeholder="Tu nombre y apellido" required>
                </div>

                <div class="form-item">
                    <label for="guestsCount">Acompañantes</label>
                    <select id="guestsCount">
                        <option value="Voy solo(a)">Voy solo(a)</option>
                        <option value="+1 Acompañante">+1 Acompañante</option>
                        <option value="+2 Acompañantes">+2 Acompañantes</option>
                        <option value="+3 Acompañantes">+3 Acompañantes</option>
                    </select>
                </div>

                <button type="button" class="btn-submit" onclick="enviarConfirmacion()">
                    Confirmar por WhatsApp 💬
                </button>
            </section>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('balloonsCanvas');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // Paleta elegante de globos
        const balloonPalettes = [
            { main: '#d4af37', light: '#faeed1', dark: '#91711c' }, // Dorado metálico
            { main: '#4a2f20', light: '#85593e', dark: '#24140b' }, // Café espresso
            { main: '#b8860b', light: '#f7de94', dark: '#6e4f04' }, // Ámbar tostado
            { main: '#966e51', light: '#cbac93', dark: '#523725' }  // Moka suave
        ];

        class Balloon {
            constructor(initial = false) {
                this.reset(initial);
            }
            reset(initial = false) {
                this.radiusX = Math.random() * 10 + 13;
                this.radiusY = this.radiusX * 1.25;
                this.x = Math.random() * canvas.width;
                this.y = initial ? Math.random() * canvas.height : -60;
                this.speedY = Math.random() * 0.7 + 0.45;
                this.swingSpeed = Math.random() * 0.025 + 0.015;
                this.swingDistance = Math.random() * 1.4 + 0.6;
                this.angle = Math.random() * Math.PI * 2;
                this.palette = balloonPalettes[Math.floor(Math.random() * balloonPalettes.length)];
                this.alpha = Math.random() * 0.35 + 0.45;
            }
            update() {
                this.y += this.speedY;
                this.angle += this.swingSpeed;
                this.x += Math.sin(this.angle) * this.swingDistance;
                if (this.y > canvas.height + 70) this.reset(false);
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.translate(this.x, this.y);
                ctx.rotate(Math.sin(this.angle) * 0.15);

                // Hilo del globo
                ctx.strokeStyle = 'rgba(180, 160, 140, 0.45)';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(0, this.radiusY);
                ctx.quadraticCurveTo(Math.sin(this.angle) * 8, this.radiusY + 14, Math.cos(this.angle) * 5, this.radiusY + 30);
                ctx.stroke();

                // Nudo del globo
                ctx.fillStyle = this.palette.dark;
                ctx.beginPath();
                ctx.moveTo(-2.5, this.radiusY);
                ctx.lineTo(2.5, this.radiusY);
                ctx.lineTo(0, this.radiusY + 3.5);
                ctx.closePath();
                ctx.fill();

                // Cuerpo del globo con degradado 3D
                const grad = ctx.createRadialGradient(
                    -this.radiusX * 0.3, -this.radiusY * 0.35, this.radiusX * 0.1,
                    0, 0, this.radiusY
                );
                grad.addColorStop(0, this.palette.light);
                grad.addColorStop(0.5, this.palette.main);
                grad.addColorStop(1, this.palette.dark);

                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.ellipse(0, 0, this.radiusX, this.radiusY, 0, 0, Math.PI * 2);
                ctx.fill();

                // Reflejo blanco curvo en la esquina superior izquierda
                ctx.fillStyle = 'rgba(255, 255, 255, 0.45)';
                ctx.beginPath();
                ctx.ellipse(-this.radiusX * 0.35, -this.radiusY * 0.35, this.radiusX * 0.22, this.radiusY * 0.15, -0.6, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();
            }
        }

        const totalBalloons = window.innerWidth < 600 ? 12 : 20;
        const balloons = [];
        for (let i = 0; i < totalBalloons; i++) {
            balloons.push(new Balloon(true));
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            balloons.forEach(b => {
                b.update();
                b.draw();
            });
            requestAnimationFrame(animate);
        }
        animate();

        const TELEFONO_WHATSAPP = '524471178214';

        function enviarConfirmacion() {
            const nombre = document.getElementById('guestName').value.trim();
            const acompanantes = document.getElementById('guestsCount').value;

            if (!nombre) {
                alert('Por favor escribe tu nombre antes de enviar la confirmación.');
                document.getElementById('guestName').focus();
                return;
            }

            if (typeof confetti === 'function') {
                confetti({
                    particleCount: 50,
                    spread: 60,
                    origin: { y: 0.85 },
                    colors: ['#8c5835', '#d9be9b', '#2c1d16']
                });
            }

            const mensaje = `¡Hola! Confirmo mi asistencia al cumpleaños de Emily y Emiliano 🍸☕%0A%0A` +
                            `👤 *Invitado:* ${encodeURIComponent(nombre)}%0A` +
                            `👥 *Acompañantes:* ${encodeURIComponent(acompanantes)}%0A%0A` +
                            `¡Nos vemos el sábado 14 de noviembre a las 7:00 PM!`;

            const url = `https://wa.me/${TELEFONO_WHATSAPP}?text=${mensaje}`;

            setTimeout(() => {
                window.open(url, '_blank');
            }, 400);
        }
    </script>
</body>
</html>
