<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emily & Emiliano | A 'Tini Bit Older</title>

    <meta property="og:type" content="website">
    <meta property="og:title" content="🍸 Emily & Emiliano are A 'Tini Bit Older">
    <meta property="og:description" content="Acompáñanos a celebrar nuestro cumpleaños. Confirma tu asistencia aquí.">
    <meta property="og:image" content="https://gtek-soluciones.com/static/img/invitacion_preview.jpg">
    <meta property="og:url" content="https://gtek-soluciones.com/invitacion">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,400&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>

    <style>
        :root {
            --espresso-dark: #20130d;
            --espresso-mid: #4a3328;
            --caramel: #8c5835;
            --line-border: #dcd2c4;
            --text-sub: #635347;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: linear-gradient(rgba(10, 6, 5, 0.4), rgba(10, 6, 5, 0.7)),
                        url("{{ url_for('static', filename='img/background_texture.jpg') }}?v=4") no-repeat center center fixed;
            background-size: cover;
            color: var(--espresso-dark);
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 16px;
            position: relative;
        }

        #particleCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* Contenedor tipo tarjeta vertical con márgenes para ver el fondo */
        .poster-card {
            background-color: #f7f3ed;
            border-radius: 24px;
            max-width: 360px;
            width: 90%;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.75), 0 0 20px rgba(212, 175, 55, 0.15);
            position: relative;
            z-index: 1;
            overflow: hidden;
            animation: fadeInCard 0.8s ease-out forwards;
        }

        @keyframes fadeInCard {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .poster-image {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Sección de acciones y ubicación */
        .actions-panel {
            padding: 16px 20px 24px 20px;
            background-color: #f7f3ed;
            text-align: center;
        }

        .location-box {
            margin-bottom: 18px;
            font-size: 0.82rem;
            line-height: 1.4;
            color: var(--espresso-mid);
        }

        .location-box strong {
            display: block;
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.15rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--espresso-dark);
            margin-bottom: 2px;
        }

        .map-btn {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            margin-top: 6px;
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: var(--caramel);
            text-decoration: none;
            font-weight: 600;
            border-bottom: 1px solid var(--caramel);
            padding-bottom: 1px;
        }

        /* Tarjeta de Confirmación */
        .rsvp-container {
            background: rgba(255, 255, 255, 0.7);
            border: 1px dashed var(--line-border);
            border-radius: 14px;
            padding: 16px 14px;
            text-align: left;
        }

        .rsvp-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 1.8px;
            font-weight: 700;
            text-align: center;
            color: var(--espresso-dark);
            margin-bottom: 10px;
        }

        .form-item {
            margin-bottom: 10px;
        }

        label {
            display: block;
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-sub);
            margin-bottom: 3px;
            font-weight: 600;
        }

        input, select {
            width: 100%;
            background: #fff;
            border: 1px solid var(--line-border);
            border-radius: 6px;
            padding: 9px 10px;
            font-size: 0.85rem;
            color: var(--espresso-dark);
            font-family: inherit;
            outline: none;
        }

        input:focus, select:focus {
            border-color: var(--caramel);
        }

        .btn-submit {
            width: 100%;
            background: var(--espresso-dark);
            color: #f7f3ed;
            border: none;
            border-radius: 8px;
            padding: 13px;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.82rem;
            font-weight: 600;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            cursor: pointer;
            margin-top: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: background 0.2s ease;
        }

        .btn-submit:hover {
            background: var(--espresso-mid);
        }
    </style>
</head>
<body>

    <canvas id="particleCanvas"></canvas>

    <div class="poster-card">
        <!-- El póster ilustrado completo -->
        <img src="{{ url_for('static', filename='img/espresso_header.jpg') }}?v=4" alt="Invitación Emily & Emiliano" class="poster-image">

        <div class="actions-panel">
            <div class="location-box">
                <strong>San Nicolás</strong>
                <p>Tacario 166, Centro</p>
                <p>Maravatío de Ocampo, Michoacán</p>
                <a class="map-btn" href="https://www.google.com/maps/search/?api=1&query=Tacario+166+San+Nicolas+Centro+Maravatio+de+Ocampo+Michoacan" target="_blank" rel="noopener">
                    📍 Abrir en Google Maps
                </a>
            </div>

            <!-- Confirmación -->
            <section class="rsvp-container">
                <h2 class="rsvp-title">Confirmar Asistencia</h2>

                <div class="form-item">
                    <label for="guestName">Nombre del Invitado</label>
                    <input type="text" id="guestName" placeholder="Tu nombre y apellido" required>
                </div>

                <div class="form-item">
                    <label for="guestsCount">Acompañantes</label>
                    <select id="guestsCount">
                        <option value="Voy solo(a)">Voy solo(a)</option>
                        <option value="+1 Acompañante">+1 Acompañante</option>
                        <option value="+2 Acompañantes">+2 Acompañantes</option>
                        <option value="+3 Acompañantes">+3 Acompañantes</option>
                    </select>
                </div>

                <div class="form-item">
                    <label for="drinkPref">Bebida de Preferencia</label>
                    <select id="drinkPref">
                        <option value="Espresso Martini clásico">Espresso Martini clásico</option>
                        <option value="Carajillo shakerato">Carajillo shakerato</option>
                        <option value="Cóctel sin alcohol (Mocktail)">Cóctel sin alcohol</option>
                        <option value="Cerveza / Vino / Refresco">Cerveza / Vino / Refresco</option>
                    </select>
                </div>

                <button type="button" class="btn-submit" onclick="enviarConfirmacion()">
                    Confirmar por WhatsApp 💬
                </button>
            </section>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor() { this.reset(); }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2 + 0.4;
                this.speedY = -(Math.random() * 0.3 + 0.1);
                this.speedX = (Math.random() - 0.5) * 0.2;
                this.alpha = Math.random() * 0.45 + 0.15;
                this.fade = Math.random() * 0.005 + 0.002;
            }
            update() {
                this.y += this.speedY;
                this.x += this.speedX;
                this.alpha += this.fade;
                if (this.alpha <= 0.05 || this.alpha >= 0.55) this.fade = -this.fade;
                if (this.y < -10) this.reset();
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.alpha);
                ctx.fillStyle = '#d4af37';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        const count = window.innerWidth < 600 ? 25 : 45;
        for (let i = 0; i < count; i++) particles.push(new Particle());

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animate);
        }
        animate();

        const TELEFONO_WHATSAPP = '524471178214';

        function enviarConfirmacion() {
            const nombre = document.getElementById('guestName').value.trim();
            const acompanantes = document.getElementById('guestsCount').value;
            const bebida = document.getElementById('drinkPref').value;

            if (!nombre) {
                alert('Por favor escribe tu nombre antes de enviar la confirmación.');
                document.getElementById('guestName').focus();
                return;
            }

            if (typeof confetti === 'function') {
                confetti({
                    particleCount: 50,
                    spread: 60,
                    origin: { y: 0.85 },
                    colors: ['#8c5835', '#d9be9b', '#2c1d16']
                });
            }

            const mensaje = `¡Hola! Confirmo mi asistencia al cumpleaños de Emily y Emiliano 🍸☕%0A%0A` +
                            `👤 *Invitado:* ${encodeURIComponent(nombre)}%0A` +
                            `👥 *Acompañantes:* ${encodeURIComponent(acompanantes)}%0A` +
                            `🍸 *Bebida preferida:* ${encodeURIComponent(bebida)}%0A%0A` +
                            `¡Nos vemos el sábado 14 de noviembre a las 7:00 PM!`;

            const url = `https://wa.me/${TELEFONO_WHATSAPP}?text=${mensaje}`;

            setTimeout(() => {
                window.open(url, '_blank');
            }, 400);
        }
    </script>
</body>
</html>
